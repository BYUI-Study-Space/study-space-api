# Local development database only; the API itself runs with `make run`.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: studyspace
      POSTGRES_PASSWORD: studyspace
      POSTGRES_DB: studyspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyspace -d studyspace"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
