# Local stack. `make db-up` starts only Postgres (for `make run`);
# `make up` also builds and runs the API image.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: studyspace
      POSTGRES_PASSWORD: studyspace
      POSTGRES_DB: studyspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyspace -d studyspace"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    image: study-space-api
    environment:
      DATABASE_URL: postgres://studyspace:studyspace@db:5432/studyspace?sslmode=disable
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      TIMEZONE: America/Denver
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
